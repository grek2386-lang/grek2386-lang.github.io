<!DOCTYPE html>
<html lang="ru">
<head>
  <!-- AdSense (оставляем ваш ID) -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4258758862980138"
     crossorigin="anonymous"></script>
  <meta name="google-adsense-account" content="ca-pub-4258758862980138">

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Калькулятор ремонта</title>
  <meta name="theme-color" content="#bdbdbd">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png" type="image/png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Калькулятор ремонта">
  <link rel="apple-touch-icon" href="icon-512.png">

  <!-- Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..700,0..1,0..200" rel="stylesheet">

  <style>
    :root{
      --bg: #ececec;            /* светлый бетон */
      --card: #ffffff;
      --accent: #2e7d32;       /* зелёный */
      --accent-2: #fb8c00;     /* оранжевый */
      --muted: #6b6b6b;
      --radius: 14px;
      --glass: rgba(255,255,255,0.7);
    }
    *{box-sizing:border-box}
    body{
      margin:0; padding:0; font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      background: linear-gradient(180deg,var(--bg),#efefef 60%);
      color:#222; -webkit-font-smoothing:antialiased;
    }

    header.appbar{
      background: linear-gradient(180deg,#cfcfcf,#bdbdbd);
      padding:14px 16px; color:#111; display:flex; align-items:center; gap:12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      position:sticky; top:0; z-index:40;
    }
    header .logo{
      width:44px; height:44px; border-radius:10px; display:flex; align-items:center; justify-content:center;
      background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:white; font-weight:700; font-size:20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
    }
    header h1{font-size:18px; margin:0; letter-spacing:0.2px}
    header p{font-size:12px; margin:0; color:var(--muted)}

    .container{max-width:980px; margin:18px auto; padding:14px;}

    .controls { display:flex; gap:10px; margin-bottom:14px; align-items:center; flex-wrap:wrap; }
    .controls .btn{ display:inline-flex; align-items:center; gap:8px; padding:10px 12px; border-radius:12px; border:none; cursor:pointer; background:var(--card); box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .controls .btn.primary{ background: linear-gradient(135deg,var(--accent),#1b5e20); color:white; }
    .controls .btn.warn{ background: linear-gradient(135deg,#f44336,#d32f2f); color:white; }

    .section-title{display:flex; align-items:center; gap:10px; margin:6px 0 12px 0}
    .section-title h2{margin:0; font-size:18px}

    .card{ background:var(--card); border-radius:var(--radius); padding:14px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); margin-bottom:12px; transition:transform .12s ease, box-shadow .12s ease; }
    .card:hover{ transform:translateY(-4px); box-shadow: 0 12px 28px rgba(0,0,0,0.08); }

    label{ display:flex; align-items:center; gap:8px; justify-content:space-between; margin:8px 0; flex-wrap:wrap; }
    input[type="number"], select{ padding:8px 10px; border-radius:10px; border:1px solid #d0d0d0; min-width:76px; text-align:center }
    .dim-group{ display:inline-flex; gap:6px; align-items:center }
    .unit-select{ min-width:72px; padding:6px 8px }

    button.full{ width:100%; padding:10px 12px; border-radius:12px; border:none; cursor:pointer; background:linear-gradient(135deg,var(--accent),#1b5e20); color:white; font-weight:600 }
    button.full.ghost{ background:transparent; border:1px solid #ddd; color:#333 }
    button.remove{ background:linear-gradient(135deg,#d32f2f,#b71c1c); color:white }

    .orientation{ display:flex; gap:12px; align-items:center; flex-wrap:wrap }
    .result{ background: linear-gradient(180deg,#f7fff8,#e8f5e9); border-left:4px solid var(--accent); padding:10px; border-radius:8px; margin-top:8px; font-weight:600 }

    /* FAB */
    .fab-container{ position:fixed; right:18px; bottom:18px; display:flex; flex-direction:column; gap:10px; z-index:100 }
    .fab{ width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 18px rgba(0,0,0,0.16); border:none; cursor:pointer }
    .fab.save{ background:linear-gradient(135deg,var(--accent),#27632a); color:white }
    .fab.load{ background:linear-gradient(135deg,#ffb74d,#fb8c00); color:white }
    .fab.clear{ background:linear-gradient(135deg,#ef5350,#e53935); color:white }

    /* ad */
    #ad-area{ margin:16px 0; display:flex; align-items:center; justify-content:center }
    .ad-note{ font-size:12px; color:var(--muted); margin-bottom:8px; text-align:center }

    @media (min-width:900px){ .container{ padding:0 } .card{ padding:18px } }
  </style>
</head>
<body>
  <header class="appbar">
    <div class="logo">RC</div>
    <div>
      <h1>Калькулятор ремонта</h1>
      <p>Быстрый расчёт материалов — PWA</p>
    </div>
  </header>

  <main class="container">
    <div class="controls">
      <button id="addWallBtnTop" class="btn"><span class="material-symbols-outlined">wallpaper</span> Добавить стену</button>
      <div style="flex:1"></div>
      <button id="saveProject" class="btn primary"><span class="material-symbols-outlined">save</span> Сохранить</button>
      <button id="loadProject" class="btn"><span class="material-symbols-outlined">folder_open</span> Загрузить</button>
      <button id="clearProject" class="btn warn"><span class="material-symbols-outlined">delete</span> Очистить</button>
    </div>

    <section>
      <div class="section-title"><h2>Стены</h2><small class="material-symbols-outlined" style="color:var(--muted)">meeting_room</small></div>
      <div id="walls"></div>
      <div style="margin-top:8px;">
        <button id="addWall" class="full ghost"><span class="material-symbols-outlined">add</span> Добавить стену</button>
      </div>
    </section>

    <!-- Рекламный блок между секциями -->
    <div id="ad-area" class="card" aria-hidden="false">
      <div style="width:100%; max-width:760px">
        <div class="ad-note">Реклама — поддержка проекта</div>
        <!-- AdSense: place your unit below -->
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-4258758862980138"
             data-ad-slot="1234567890"
             data-ad-format="auto"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
      </div>
    </div>

    <section>
      <div class="section-title"><h2>Материалы</h2><small class="material-symbols-outlined" style="color:var(--muted)">inventory_2</small></div>
      <div id="materials"></div>
      <div style="margin-top:8px;">
        <button id="addMaterial" class="full"><span class="material-symbols-outlined">add_box</span> Добавить материал</button>
      </div>
    </section>

  </main>

  <!-- Плавающие кнопки (FAB) -->
  <div class="fab-container" role="toolbar" aria-label="Проект">
    <button class="fab save" id="fabSave" title="Сохранить"><span class="material-symbols-outlined">save</span></button>
    <button class="fab load" id="fabLoad" title="Загрузить"><span class="material-symbols-outlined">folder_open</span></button>
    <button class="fab clear" id="fabClear" title="Очистить"><span class="material-symbols-outlined">delete</span></button>
  </div>

  <!-- Ниже мы вставляем оригинальный JavaScript без изменений логики, только небольшие привязки к новым кнопкам -->
  <script>
    // Перенесён ваш скрипт — функционал НЕ изменён, только подключены дополнительные кнопки к тем же обработчикам
    const wallsContainer = document.getElementById('walls');
    const materialsContainer = document.getElementById('materials');
    let walls = [];
    let wallCount = 0;
    const DEFAULT_UNIT = 'm';
    const parseNum = v => parseFloat(v) || 0;
    const toM = (v,u)=>u==='cm'?v/100:v;
    const findWall = id => walls.find(w => w.id == id);

    // ---------- LocalStorage ----------
    function saveToStorage() {
      const data = {
        walls,
        materials: [...materialsContainer.querySelectorAll('.material')].map(m => ({
          type: m.querySelector('.type').value,
          target: m.querySelector('.target').value,
          len: parseNum(m.querySelector('.mlen').value),
          wid: parseNum(m.querySelector('.mwid').value),
          lenUnit: m.querySelectorAll('.unit-select')[0]?.value,
          widUnit: m.querySelectorAll('.unit-select')[1]?.value,
          orient: m.querySelector('input[type="radio"]:checked')?.value || "vertical"
        }))
      };
      localStorage.setItem("repair_calc_project", JSON.stringify(data));
    }

    function loadFromStorage() {
      const data = JSON.parse(localStorage.getItem("repair_calc_project") || "{}");
      if (!data.walls) return;
      walls = []; wallsContainer.innerHTML = ""; materialsContainer.innerHTML = ""; wallCount = 0;
      data.walls.forEach(w => createWall(w));
      data.materials?.forEach(m => {
        const div = createMaterial(m);
        div.querySelector('.type').value = m.type;
        div.querySelector('.target').value = m.target;
        div.querySelector('.mlen').value = m.len;
        div.querySelector('.mwid').value = m.wid;
        div.querySelectorAll('.unit-select')[0].value = m.lenUnit;
        div.querySelectorAll('.unit-select')[1].value = m.widUnit;
        if (m.type === "panel") {
          div.querySelectorAll('input[type="radio"]').forEach(r=>r.checked=(r.value===m.orient));
        }
      });
      updateTargets();
    }

    function clearStorage() {
      if (confirm("Очистить всё?")) {
        localStorage.removeItem("repair_calc_project");
        location.reload();
      }
    }

    // Подключаем кнопки (новые и старые) к обработчикам
    document.getElementById("saveProject").onclick = () => { saveToStorage(); alert("✅ Сохранено!"); };
    document.getElementById("loadProject").onclick = loadFromStorage;
    document.getElementById("clearProject").onclick = clearStorage;
    document.getElementById("fabSave").onclick = () => document.getElementById("saveProject").click();
    document.getElementById("fabLoad").onclick = () => document.getElementById("loadProject").click();
    document.getElementById("fabClear").onclick = () => document.getElementById("clearProject").click();
    document.getElementById("addWallBtnTop").onclick = () => { createWall(); saveToStorage(); };

    // ---------- Основные ----------
    const unitSelectHtml = (def=DEFAULT_UNIT)=>`
      <select class="unit-select">
        <option value="m" ${'${def}'==='m'?'selected':''}>м</option>
        <option value="cm" ${'${def}'==='cm'?'selected':''}>см</option>
      </select>`;

    function updateTargets() {
      document.querySelectorAll('.target').forEach(sel=>{
        const prev = sel.value;
        sel.innerHTML = '<option value="">- Выберите цель -</option>';
        if (walls.length>0)
          sel.innerHTML += `<option value="all-walls">Все стены</option><option value="all-floors">Все полы</option>`;
        walls.forEach(w=>{
          const area = toM(w.length,w.unit)*toM(w.height,w.unit);
          sel.innerHTML += `<option value="wall-${w.id}">Стена ${w.id} (${area.toFixed(2)} м²)</option>`;
          if(w.floor){
            const fa=toM(w.floor.length,w.floor.unit)*toM(w.floor.width,w.floor.unit);
            sel.innerHTML += `<option value="floor-${w.id}">Пол ${w.id} (${fa.toFixed(2)} м²)</option>`;
          }
        });
        if([...sel.options].some(o=>o.value===prev)) sel.value=prev;
      });
    }

    // ---------- Стены ----------
    function createWall(existing=null){
      wallCount++;
      const id=wallCount;
      const wall=existing || {id,length:0,height:0,unit:DEFAULT_UNIT,inner:0,outer:0,floor:null};
      wall.id=id;
      walls.push(wall);

      const div=document.createElement('div');
      div.className='wall card';
      div.innerHTML=`
        <h4>Стена ${id}</h4>
        <label>Длина: <span class="dim-group"><input type="number" class="len" value="${wall.length}">${unitSelectHtml(wall.unit)}</span></label>
        <label>Высота: <span class="dim-group"><input type="number" class="hei" value="${wall.height}">${unitSelectHtml(wall.unit)}</span></label>
        <label>Внутренних углов: <input type="number" class="in" value="${wall.inner}" min="0" max="10" style="width:60px;"></label>
        <label>Наружных углов: <input type="number" class="out" value="${wall.outer}" min="0" max="10" style="width:60px;"></label>
        <label><input type="checkbox" class="fchk" ${wall.floor?'checked':''}> Учитывать пол</label>
        <div class="floor" style="display:${wall.floor?'block':'none'};">
          <label>Длина пола: <span class="dim-group"><input type="number" class="flen" value="${wall.floor?.length||0}">${unitSelectHtml(wall.floor?.unit||'m')}</span></label>
          <label>Ширина пола: <span class="dim-group"><input type="number" class="fwid" value="${wall.floor?.width||0}">${unitSelectHtml(wall.floor?.unit||'m')}</span></label>
        </div>
        <div style="display:flex; gap:8px; margin-top:8px;">
          <button class="btn remove remove-wall" style="padding:8px 10px;">Удалить</button>
        </div>
      `;
      const upd=()=>{updateTargets(); saveToStorage();};
      div.querySelector('.len').oninput=e=>{wall.length=parseNum(e.target.value);upd();};
      div.querySelector('.hei').oninput=e=>{wall.height=parseNum(e.target.value);upd();};
      div.querySelector('.in').oninput=e=>{wall.inner=parseNum(e.target.value);upd();};
      div.querySelector('.out').oninput=e=>{wall.outer=parseNum(e.target.value);upd();};
      div.querySelectorAll('.unit-select')[0].onchange=e=>{wall.unit=e.target.value;upd();};
      div.querySelectorAll('.unit-select')[1].onchange=e=>{wall.unit=e.target.value;upd();};
      const fchk=div.querySelector('.fchk');
      fchk.onchange=()=>{
        const floorDiv=div.querySelector('.floor');
        if(fchk.checked){ floorDiv.style.display='block'; wall.floor={length:0,width:0,unit:DEFAULT_UNIT}; }
        else{ floorDiv.style.display='none'; wall.floor=null; }
        upd();
      };
      div.querySelector('.flen').oninput=e=>{if(wall.floor)wall.floor.length=parseNum(e.target.value);upd();};
      div.querySelector('.fwid').oninput=e=>{if(wall.floor)wall.floor.width=parseNum(e.target.value);upd();};
      div.querySelectorAll('.floor .unit-select').forEach(s=>s.onchange=e=>{if(wall.floor)wall.floor.unit=e.target.value;upd();});
      div.querySelector('.remove-wall').onclick=()=>{walls=walls.filter(w=>w.id!==id);div.remove();upd();};
      wallsContainer.appendChild(div);
      updateTargets();
    }

    // ---------- Материалы ----------
    function createMaterial(existing=null){
      const div=document.createElement('div');
      div.className='material card';
      const uid=Date.now()+Math.random();
      div.innerHTML=`
        <h4>Материал</h4>
        <label>Тип:
          <select class="type">
            <option value="tile">Плитка</option>
            <option value="plinth">Плинтус</option>
            <option value="linoleum">Линолеум</option>
            <option value="panel">Стеновая панель</option>
            <option value="wallpaper">Обои</option>
          </select>
        </label>
        <label>Применить к: <select class="target"></select></label>
        <label><span>Длина:</span><span class="dim-group"><input type="number" class="mlen" value="${existing?.len||0}">${unitSelectHtml(existing?.lenUnit||'m')}</span></label>
        <label><span>Ширина:</span><span class="dim-group"><input type="number" class="mwid" value="${existing?.wid||0}">${unitSelectHtml(existing?.widUnit||'m')}</span></label>
        <div class="orientation" style="display:none;">
          <span style="font-weight:500;color:#444;">Монтаж панелей:</span>
          <label><input type="radio" name="orient-${uid}" value="vertical" checked> Вертикально</label>
          <label><input type="radio" name="orient-${uid}" value="horizontal"> Горизонтально</label>
        </div>
        <div style="display:flex; gap:8px; margin-top:8px;">
          <button class="btn" style="padding:8px 12px;" class="calc">Рассчитать</button>
          <button class="btn ghost" style="padding:8px 12px;" onclick="(function(b){ b.closest('.material').remove(); updateTargets(); saveToStorage(); })(this); return false;">Удалить</button>
        </div>
        <div class="result"></div>
      `;
      materialsContainer.appendChild(div);
      updateTargets();
      const typeSel=div.querySelector('.type');
      const orientDiv=div.querySelector('.orientation');
      const refresh=()=>{ orientDiv.style.display = typeSel.value==='panel'?'flex':'none'; saveToStorage(); };
      typeSel.onchange=refresh; refresh();

      div.querySelector('.calc').onclick=()=>{
        const type=div.querySelector('.type').value;
        const target=div.querySelector('.target').value;
        const len=parseNum(div.querySelector('.mlen').value);
        const wid=parseNum(div.querySelector('.mwid').value);
        const lenUnit=div.querySelectorAll('.unit-select')[0]?.value||'m';
        const widUnit=div.querySelectorAll('.unit-select')[1]?.value||'m';
        const res=div.querySelector('.result');
        if(!target){res.innerHTML='❌ Выберите цель';return;}
        if(len<=0){res.innerHTML='⚠️ Введите длину материала';return;}
        let count=0;

        if(type==='plinth'){
          let total=0; if(target==='all-walls') walls.forEach(w=> total+=toM(w.length,w.unit));
          else if(target.startsWith('wall-')){const w=findWall(target.split('-')[1]); if(w) total=toM(w.length,w.unit);}
          count=total/toM(len,lenUnit);
        }
        else if(type==='panel'){
          const orient=div.querySelector('input[type="radio"]:checked')?.value||'vertical';
          let total=0; if(target==='all-walls'){
            walls.forEach(w=>{
              const L=toM(w.length,w.unit),H=toM(w.height,w.unit);
              const pL=toM(len,lenUnit),pW=toM(wid,widUnit);
              total+=orient==='vertical' ? Math.ceil(H/pL)*Math.ceil(L/pW) : Math.ceil(H/pW)*Math.ceil(L/pL);
            });
          } count=total;
        }
        else{
          let area=0;
          if(target==='all-walls') walls.forEach(w=> area+=toM(w.length,w.unit)*toM(w.height,w.unit));
          else if(target.startsWith('wall-')){const w=findWall(target.split('-')[1]); if(w) area=toM(w.length,w.unit)*toM(w.height,w.unit);}
          const matA=toM(len,lenUnit)*toM(wid,widUnit);
          count=area/matA;
        }
        const withExtra=Math.ceil(count*1.1);
        res.innerHTML=`Количество: ${Math.ceil(count)} шт<br><strong>С запасом: ${withExtra} шт</strong>`;
        saveToStorage();
      };
      return div;
    }

    // ---------- Инициализация ----------
    document.getElementById('addWall').onclick=()=>{createWall();saveToStorage();};
    document.getElementById('addMaterial').onclick=()=>{createMaterial();saveToStorage();};
    createWall();
    window.addEventListener("beforeunload", saveToStorage);
    loadFromStorage();
  </script>

</body>
</html>
